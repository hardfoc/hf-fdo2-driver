<text x="56" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">ParseVersionLine()</text>
<rect x="231.7" y="357.4" width="157.2" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="239.7" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">ParseMoxyLine()</text>
<rect x="396.9" y="357.4" width="158" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="404.9" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">ParseMrawLine()</text>
<rect x="562.9" y="357.4" width="114.4" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="570.9" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">FlashLogo()</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#C7CBFF">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#C7CBFF">fdo2::Driver&lt;UartT&gt;, inc/fdo2_driver.hpp</text>
<text x="56" y="476.4" font-size="20" font-weight="700" fill="#C7CBFF">Communication interface</text>
<text x="56" y="507" font-size="17" fill="#D2DAE4">UartInterface&lt;Derived&gt;: CRTP base, calls resolved at compile time; the driver above it builds</text>
<text x="56" y="531.7" font-size="17" fill="#D2DAE4">the ASCII commands, parses the replies, decodes #ERRO codes and strips the CRC suffix</text>
<text x="56" y="630.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform port (your class)</text>
<text x="56" y="659.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">write()  read()  flush_rx()</text>
<text x="56" y="682.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">delay_ms_impl() optional</text>
<text x="56" y="781.4" font-size="20" font-weight="700" fill="#E8EDF3">FDO2-G2</text>
<text x="56" y="812" font-size="17" fill="#D2DAE4">UART 19200 baud 8N1, 3.0 V levels  /  connector pins GND, TXD, RXD, VCC</text>
<rect x="32" y="847.8" width="14" height="14" rx="4" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
<text x="54" y="862.4" font-size="16" fill="#9AA6B5">this library</text>
<rect x="161.8" y="847.8" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2DD4BF" stroke-width="1.4"/>
<text x="183.8" y="862.4" font-size="16" fill="#9AA6B5">you write</text>
<rect x="282.1" y="847.8" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="304.1" y="862.4" font-size="16" fill="#9AA6B5">hardware</text>
</svg>
