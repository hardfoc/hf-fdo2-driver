<text x="56" y="184.4" font-size="20" font-weight="700" fill="#E8EDF3">Your application</text>
<text x="56" y="215" font-size="17" fill="#D2DAE4">incubator control, gas monitoring, data logging ...</text>
<rect x="48" y="323.4" width="135.3" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="56" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">ReadVersion()</text>
<rect x="191.3" y="323.4" width="144.9" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="199.3" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">ReadUniqueId()</text>
<rect x="344.2" y="323.4" width="147.9" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="352.2" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">MeasureMoxy()</text>
