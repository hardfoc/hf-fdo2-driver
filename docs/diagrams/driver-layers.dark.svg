<rect x="656.7" y="323.4" width="144.1" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="664.7" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">SendMeasure()</text>
<rect x="808.7" y="323.4" width="180.6" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="816.7" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">TryReadReplyLine()</text>
